[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "traceweave"
version = "0.1.0"
description = "Evidence and provenance primitives for TraceWeave"
requires-python = ">=3.12"
dependencies = ["pydantic==2.10.5", "fastapi==0.115.6", "python-multipart==0.0.20", "typer==0.15.1", "uvicorn==0.34.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/traceweave"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = [".", "src"]
